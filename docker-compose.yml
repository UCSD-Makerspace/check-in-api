services:
  check-in-api:
    image: ghcr.io/ucsd-makerspace/check-in-api-dev:latest
    pull_policy: always
    ports:
      - "10.8.0.1:8000:8000"
    env_file: .env
    volumes:
      - ./google-sheets-service-account.json:/secrets/google-sheets-service-account.json:ro
    depends_on:
      - redis
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  redis:
    image: redis:8.4
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:latest
    environment:
      - TZ=America/Los_Angeles
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Testing: check every 30 seconds
#    command: --interval 30
    # Production: swap the line above for the two below to check every 5 minutes overnight only (midnight–6am)
    command: --schedule "0 */5 0-5 * * *"
    restart: unless-stopped

  uptime-kuma:
    image: louislam/uptime-kuma:1
    ports:
      - "10.8.0.1:3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

volumes:
  uptime-kuma-data:
