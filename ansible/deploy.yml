- import_playbook: choose-connection.yml


- name: Deploy check-in-api
  hosts: api_server
  become: true

  vars:
    deploy_dir: "/home/{{ ansible_user }}/check-in-api"
    tailscale_ip: "{{ _tailscale_ip.stdout | trim }}"

  tasks:
    - name: Look up Tailscale address
      ansible.builtin.command: tailscale ip -4
      register: _tailscale_ip
      changed_when: false

    - name: Write docker-compose.yml
      ansible.builtin.template:
        src: templates/docker-compose-api.yml.j2
        dest: "{{ deploy_dir }}/docker-compose.yml"
        mode: "0644"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
      register: compose_file

    - name: Pull and restart stack
      community.docker.docker_compose_v2:
        project_src: "{{ deploy_dir }}"
        pull: always
      become_user: "{{ ansible_user }}"
      when: compose_file.changed

- name: Deploy check-in kiosk
  hosts: kiosks
  become: true

  vars:
    deploy_dir: "/home/{{ ansible_user }}/check-in"

  tasks:
    - name: Copy docker-compose.yml
      ansible.builtin.copy:
        src: files/docker-compose-kiosk.yml
        dest: "{{ deploy_dir }}/docker-compose.yml"
        mode: "0644"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
      register: compose_file

    - name: Pull and restart stack
      community.docker.docker_compose_v2:
        project_src: "{{ deploy_dir }}"
        pull: always
      become_user: "{{ ansible_user }}"
      when: compose_file.changed
