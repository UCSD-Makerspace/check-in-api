- name: Load secrets and deploy check-in-api
  hosts: api_server

  vars_files:
    - "{{ playbook_dir }}/../secrets.yml"

  vars:
    deploy_dir: "/home/{{ ansible_user }}/check-in-api"

  tasks:
    - name: Ensure deployment directory exists
      file:
        path: "{{ deploy_dir }}"
        state: directory
        mode: "0755"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

    - name: Write .env file
      template:
        src: templates/env.j2
        dest: "{{ deploy_dir }}/.env"
        mode: "0600"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
      no_log: true

    - name: Copy Google credentials to server
      copy:
        src: "{{ google_credentials_path }}"
        dest: "{{ deploy_dir }}/google-sheets-service-account.json"
        mode: "0600"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
      no_log: true

    - name: Pull latest images and restart stack
      shell: docker compose pull && docker compose up -d
      args:
        chdir: "{{ deploy_dir }}"


- name: Load secrets and deploy kiosk env
  hosts: kiosks

  vars_files:
    - "{{ playbook_dir }}/../secrets.yml"

  vars:
    deploy_dir: "/home/{{ ansible_user }}/check-in"

  tasks:
    - name: Ensure kiosk deployment directory exists
      file:
        path: "{{ deploy_dir }}"
        state: directory
        mode: "0755"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

    - name: Write kiosk .env file
      template:
        src: templates/kiosk-env.j2
        dest: "{{ deploy_dir }}/.env"
        mode: "0600"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
      no_log: true

    - name: Restart kiosk stack to pick up env
      shell: docker compose up -d
      args:
        chdir: "{{ deploy_dir }}"
      become_user: "{{ ansible_user }}"
